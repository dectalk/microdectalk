name: node-gyp integration

on:
  push:
    branches: dectalk-develop
    paths:
      - src/**
      - include/**
      - platforms/node/**
      - .github/workflows/node.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            macos-26,
            macos-26-intel,
            ubuntu-24.04,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
          ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd platforms/node
          node copyFiles.js
          npm ci
