name: build jni stuff

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1        
      - name: Build and deploy
        run: |
          mkdir -p platforms/java/native/build/linux-x64
          mkdir -p release
          cd platforms/java/native/build/linux-x64
          cmake -DCMAKE_TOOLCHAIN_FILE=../../cmake/zig-x86_64-linux-gnu.cmake -DCMAKE_BUILD_TYPE=Release -G Ninja ../..
          echo before build
          cmake --build . --config Release
          ls
          cp liblibdtc.so ../../../../../release/
      - uses: actions/upload-artifact@v4
        with:
          name: java-test
          path: ./release/